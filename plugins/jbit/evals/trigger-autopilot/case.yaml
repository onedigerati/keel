schema_version: "1.0"
name: trigger-autopilot
description: Handing the plan over loads jbit:autopilot, not the built-in run skill.
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: The plan looks right to me. Take it from here and see it through to the end; call me if you need me.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - type: tool_used
    name: loads-autopilot
    tool: Skill
    input_match: "autopilot"
    min: 1
    arm: with-only
  - type: tool_used
    name: not-the-app-runner
    tool: Skill
    input_match: '"skill":\s*"run"'
    min: 0
    max: 0
