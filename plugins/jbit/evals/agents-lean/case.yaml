schema_version: "1.0"
name: agents-lean
description: >-
  Under `Agents: lean`, jbit:stage builds stage 2's three independent exporters (which balanced or wide would fan
  out) and verifies them in the main session, with at most one agent running at a time, and still hands the review
  (the risk line names user input) to one fresh reviewer.
tags: [outcome]
context:
  scaffold_script: scaffold.sh
execution:
  # Names neither agents nor review: both have to come from the plan's Agents line and risk line.
  prompt: go
  max_turns: 60
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill, Agent]
graders:
  - type: tool_used
    name: loads-stage
    tool: Skill
    input_match: "stage"
    min: 1
    arm: with-only
  - type: tool_used
    name: no-worktree-builders
    tool: Agent
    input_match: '"isolation":\s*"worktree"'
    min: 0
    max: 0
  - type: llm
    name: builds-inline
    focus: trace
    criteria: >-
      The main session writes all three exporters itself (its own Edit, Write or Bash calls create src/csv.js,
      src/json.js and src/markdown.js and their tests) and runs the verification itself. No Agent call is a builder
      or verifier: no agent is briefed to write or change application code, or to run jbit:verify. Never are two
      agents running at once: no two Agent calls in the same turn, and no Agent call while an earlier background
      agent has not yet reported back.
  - type: llm
    name: fresh-reviewer
    focus: trace
    criteria: >-
      After the code is built, the agent loads jbit:review (a Skill call whose skill is jbit:review or review) and
      spawns exactly one reviewer agent with the Agent tool, an agent that wrote none of stage 2's code, briefed to
      review stage 2's change. Fails if no reviewer agent is spawned (the main session reviewing its own work does
      not count), or if the review is split across several agents.
  - type: regex
    name: no-push
    target: trace
    pattern: "git push"
    match: not_contains
