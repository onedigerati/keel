schema_version: "1.0"
name: scale-check-small
description: >-
  Planning one small feature fires none of keel:plan's scale signals, so Claude writes the plan without asking
  whether to chart the project.
tags: [scale, outcome]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Add a --json flag to the CLI that prints the total as JSON, like {"total": "12.34"}. Plan it before writing any
    code; assume sensible defaults rather than asking me.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Agent]
graders:
  - type: tool_used
    name: loads-plan
    tool: Skill
    input_match: "plan"
    min: 1
    arm: with-only
  - type: file_exists
    name: writes-plan-file
    path: docs/PLAN.md
    arm: with-only
  - type: file_exists
    name: no-roadmap
    path: docs/ROADMAP.md
    exists: false
  - type: llm
    name: no-chart-question
    focus: trace
    criteria: >-
      The agent plans the feature as one plan without asking or offering to chart the project: it never asks whether
      to make a roadmap or milestones, never suggests keel:charter, and never asks whether the work is too big for
      one plan. Fails on any such question or offer.
  - type: regex
    name: no-source-changes
    target: files
    pattern: "src/"
    match: not_contains
