schema_version: "1.0"
name: charter-rechart
description: Re-charting a changed PRD diffs it against the ledger — new IDs added, dropped rows kept and dated, changed text updated in place, Covered by never cleared but a reworded covered row recorded for rework, a move of covered work asked about, CLAUDE.md left alone — and logs the diff in the plan.
tags: [charter, outcome]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    The garden committee sent a new version of the PRD; it's in docs/PRD.md, the last commit. Re-chart the roadmap
    from it. Don't start building.
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
# PRD v2 against the roadmap (see scaffold.sh's header): HRV-03 dropped; TL-06 new; PLT-03 and ACC-04 reworded
# (ACC-04 already covered); TL-01 moved to Release 1.0 (not built); ACC-03 moved to Release 1.1 (already covered).
graders:
  - type: tool_used
    name: loads-charter
    tool: Skill
    input_match: "charter"
    min: 1
    arm: with-only
  - type: llm
    name: ledger-diffed-in-place
    focus: { source: file, path: docs/ROADMAP.md }
    criteria: >-
      The requirements table still has a row for HRV-03, with its Milestone cell starting `dropped ` followed by a
      date in YYYY-MM-DD form. It has a new row TL-06 (reserving a tool up to seven days ahead) in milestone M2 with
      PRD § 5.4 and an empty Covered by cell, and no other ID was renumbered or reused. PLT-03's text now says the
      season starts 1 April, and ACC-04's text says the link is valid for 30 minutes, each still under its own ID.
      TL-01's Milestone cell is M1. Every table row still has exactly five cells (PLT-02's pipes stay escaped as
      `\|`). The `Source:` line still names docs/PRD.md and now carries a re-charted date.
  - type: llm
    name: coverage-never-cleared
    focus: { source: file, path: docs/ROADMAP.md }
    criteria: >-
      ACC-01, ACC-02, ACC-03 and ACC-04 each still have the link `[Accounts](plans/2026-11-20-accounts.md)` in their
      Covered by cell (none was cleared, changed or turned into a bare name), and no other row's Covered by cell holds
      anything (not TBD, n/a, a dash or a status).
  - type: llm
    name: rework-recorded
    focus: { source: file, path: docs/ROADMAP.md }
    criteria: >-
      `## Open questions` has a line recording that ACC-04 needs rework, of the form
      `- Rework ACC-04: <what changed> (re-charted <YYYY-MM-DD>)`, where what changed says the reset link is now valid
      for 30 minutes instead of one hour. The PRD's waiting-list question (PLT-07) is still there, since v2 doesn't
      answer it.
  - type: llm
    name: covered-changes-surfaced
    focus: trace
    criteria: >-
      The agent reports the diff to the user by ID: added TL-06, dropped HRV-03, changed PLT-03 and ACC-04, moved
      TL-01 to M1 and ACC-03 to Release 1.1. It points out that ACC-04 was already covered by 2026-11-20-accounts
      and its new wording (30 minutes instead of one hour) means that built work needs changing. It does not
      silently move ACC-03, which is already covered, to M2: either its Milestone cell is left at M1 and the agent
      raises the move with the user (asks, or records it as an open question), or the agent moved it and says so
      explicitly while noting the work is already built.
  - type: llm
    name: diff-logged-in-plan
    focus: { source: file, path: docs/PLAN.md }
    criteria: >-
      The plan's Decisions section has a new dated entry recording the re-charter of docs/PRD.md and what changed
      (at least that TL-06 was added and HRV-03 dropped), alongside the earlier 2026-11-21 plot-number decision,
      which is kept. The plan's stages are not rewritten to build the new requirements.
  - type: llm
    name: claude-md-untouched
    focus: { source: file, path: CLAUDE.md }
    criteria: >-
      CLAUDE.md is unchanged in substance, since PRD v2's locked decisions are the same as v1's: it still has the
      flask run and pytest line, and its `## Locked decisions (from docs/PRD.md)` section lists the same three
      decisions (the stack, ISO 8601 UTC dates and integer grams, at most two plots per member). Nothing outside
      that section was rewritten or removed, and no line about process, review, agents or approvals was added.
  - type: regex
    name: no-source-changes
    target: files
    pattern: "\\.py"
    match: not_contains
