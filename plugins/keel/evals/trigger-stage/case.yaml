schema_version: "1.0"
name: trigger-stage
description: 'Saying "go" on a planned project loads keel:stage.'
tags: [trigger]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: go
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Bash, Skill]
graders:
  - type: tool_used
    name: loads-stage
    tool: Skill
    input_match: "stage"
    min: 1
    arm: with-only
  - type: llm
    name: works-on-stage-2
    focus: trace
    criteria: The agent works on stage 2 (CSV input) from docs/PLAN.md, not on stage 3 or on unrelated changes.
