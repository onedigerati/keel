schema_version: "1.0"
name: milestone-close
description: With a roadmap, archiving a finished plan fills Covered by for the requirement its evidence proves, and the milestone closes only after the full suite, a coverage check and a fresh reviewer's evidence-fit sample; then M1 is ticked and M2 is current.
tags: [outcome]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Stage 1 is done and verified, so this plan is finished. Wrap it up and archive it. Don't build anything new;
    assume sensible defaults rather than asking me.
  max_turns: 40
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill, Agent]
graders:
  - type: tool_used
    name: loads-plan
    tool: Skill
    input_match: "plan"
    min: 1
    arm: with-only
  - type: tool_used
    name: fresh-reviewer
    tool: Agent
    min: 1
    arm: with-only
  - type: file_exists
    name: no-evidence-left
    path: "docs/evidence/stage-*/*"
    exists: false
    arm: with-only
  - type: llm
    name: covered-by-filled-right
    focus: { source: file, path: docs/ROADMAP.md }
    criteria: >-
      In the Requirements table, TAL-04's Covered by cell now holds only a link to the newly archived refunds plan
      under docs/plans/, written relative to docs/ (for example `[Refunds](plans/<date>-<slug>.md)`), and not TBD,
      n/a, a dash, a date or other text. TAL-01, TAL-02 and TAL-03 still link the Core totals plan
      (plans/2026-10-10-core-totals.md); in particular TAL-02 was not changed to the new plan even though the new
      plan's evidence also tags it. The dropped TAL-05 row and the M2 rows RPT-01 and RPT-02 still have empty
      Covered by cells, and no row was deleted.
  - type: llm
    name: m1-ticked-m2-open
    focus: { source: file, path: docs/ROADMAP.md }
    criteria: >-
      Under Milestones, M1 (Core totals) is ticked (`- [x]`) and M2 (Reports) is still unticked (`- [ ]`).
  - type: llm
    name: closes-after-checks
    focus: trace
    criteria: >-
      Before ticking M1 in docs/ROADMAP.md, the agent did all three of: ran the project's full test suite
      (npm test or node --test) and saw it pass; checked coverage, confirming each non-dropped M1 requirement
      (TAL-01 to TAL-04, not the dropped TAL-05) has a Covered by link backed by a passing tagged evidence row;
      and had a fresh agent (spawned with the Agent tool, not the agent itself) sample requirements and judge
      whether the linked evidence really delivers them. The tick came after all three, not before or instead.
  - type: llm
    name: names-m2-current
    focus: trace
    criteria: >-
      The agent's final report to the user says M1 is closed and names M2 (Reports) as the current milestone,
      the one the next plan will be cut from.
  - type: regex
    name: no-source-changes
    target: files
    pattern: "src/"
    match: not_contains
