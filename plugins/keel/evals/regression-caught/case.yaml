schema_version: "1.0"
name: regression-caught
description: At the plan's last stage, keel:verify re-runs an earlier stage's check proven by running the CLI, and reports it as fail when the new stage broke it.
tags: [outcome]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Verify stage 2. Just report; don't fix anything.
  max_turns: 25
  allowed_tools: [Read, Glob, Grep, Bash, Write, Edit, Skill]
graders:
  - type: tool_used
    name: loads-verify
    tool: Skill
    input_match: "verify"
    min: 1
    arm: with-only
  - type: file_exists
    name: writes-report
    path: docs/evidence/stage-2/report.md
  - type: llm
    name: report-reruns-earlier-check
    focus: { source: file, path: docs/evidence/stage-2/report.md }
    criteria: >-
      The report's table has a row for each of stage 2's two checks, and a further row marked as a re-run of
      stage 1's check that `node src/cli.js sample.csv` prints 13.89. That re-run row is marked fail, with the
      actual output (NaN, or whatever the CLI printed instead of 13.89) quoted in the row or linked as a saved
      file. Stage 1's test-proven check (`sums amounts in cents`) needs no re-run row of its own.
  - type: llm
    name: reply-not-verified
    criteria: >-
      The reply reports that stage 1's CLI check now fails (`node src/cli.js sample.csv` no longer prints 13.89)
      as a regression or failure, and does not call stage 2 verified, done or passing overall.
  - type: regex
    name: code-untouched
    target: files
    pattern: "src/"
    match: not_contains
