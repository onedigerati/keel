schema_version: "1.0"
name: agents-wide
description: >-
  An `Agents: wide` line from an earlier session, confirmed by the user in the prompt, is restamped with the
  current date and time; keel:stage then gives each of stage 2's independent leaves its own agent in its own
  worktree and has a fresh agent that built nothing run the verify.
tags: [outcome]
context:
  scaffold_script: scaffold.sh
execution:
  # The line ships unstamped, so the hook counts it as balanced; the user's confirmation is what restamps it.
  prompt: I confirm wide for this plan. Go.
  max_turns: 60
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill, Agent]
graders:
  - type: tool_used
    name: loads-stage
    tool: Skill
    input_match: "stage"
    min: 1
    arm: with-only
  - type: tool_used
    name: builders-in-worktrees
    tool: Agent
    input_match: '"isolation":\s*"worktree"'
    min: 2
  - type: llm
    name: restamps-wide
    focus: trace
    criteria: >-
      Before spawning any builder agent, the agent edits the `Agents: wide` line in docs/PLAN.md's `## Now` to
      `Agents: wide — confirmed <date> <time>`, with the date as YYYY-MM-DD and the time as HH:MM (for example
      `Agents: wide — confirmed 2026-11-08 14:32`), taken from the current clock (a `date` call, or the session's
      date). Fails if the line is left unstamped, stamped with only a date, or stamped after builders are spawned.
  - type: llm
    name: fans-out-leaves
    focus: trace
    criteria: >-
      The three exporters (CSV, JSON, Markdown) are built by separate agents, at least two of them spawned with
      `isolation: "worktree"` and running at the same time (spawned in one turn, or in the background before the
      others report), each briefed to own its exporter's module and test. The main session then merges or applies
      each agent's work back. Fails if the main session writes the exporters itself, or one agent builds them all.
  - type: llm
    name: fresh-verifier
    focus: trace
    criteria: >-
      The stage's verification (keel:verify, or its steps: the test suite and each check proven) is run by an agent
      spawned for it that built none of the exporters, not by the main session and not by one of the builders.
      Fails if verification runs only in the main session or only inside a builder.
  - type: regex
    name: no-push
    target: trace
    pattern: "git push"
    match: not_contains
